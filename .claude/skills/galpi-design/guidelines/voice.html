<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13px;line-height:1.6"><div><div class="v">빈 책장</div><div style="font-family:var(--font-quote);font-size:16px;margin-top:2px">첫 책을 책장에 꽂아보세요</div></div><div><div class="v">빈 대사</div><div style="font-family:var(--font-quote);font-size:16px;margin-top:2px">아직 이 책에 담은 대사가 없어요</div></div><div><div class="v">알림 유도</div><div style="font-family:var(--font-quote);font-size:16px;margin-top:2px">이 대사를 언제 다시 만날까요?</div></div><div><div class="v">빈 피드</div><div style="font-family:var(--font-quote);font-size:16px;margin-top:2px">팔로우한 사람이 없어요. 다른 독자를 찾아보세요</div></div><div><div class="v">검색 결과 없음</div><div style="font-family:var(--font-quote);font-size:16px;margin-top:2px">검색 결과가 없어요. 직접 등록해보세요</div></div><div><div class="v">에러</div><div style="font-family:var(--font-quote);font-size:16px;margin-top:2px">책장을 불러오지 못했습니다</div></div></div></div></body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Colour in use" subtitle="Ivory page → white card → brown action → gold badge" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div style="display:flex;gap:12px;align-items:center"><div style="flex:1;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-2);padding:14px"><div style="font-size:11px;font-weight:600;color:var(--text-secondary)">싱클레어</div><div style="font-family:var(--font-quote);font-size:18px;line-height:1.6;margin-top:6px">새는 알에서 나오려고 투쟁한다.</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="background:var(--accent-soft);color:var(--accent-strong);font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px">대사 12개</span><span style="background:var(--primary);color:#fff;font-size:15px;font-weight:600;padding:12px 20px;border-radius:var(--radius-control)">대사 담기</span><span style="border:1px solid var(--primary);color:var(--primary);font-size:15px;font-weight:600;padding:11px 20px;border-radius:var(--radius-control)">나중에</span></div></div></div></body></html>

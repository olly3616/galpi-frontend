<!-- @dsCard group="Colors" viewport="700x130" name="Semantic" subtitle="Error and success, desaturated to fit the paper mood" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div class="sw"><div><div class="chip" style="background:#C0492F"></div><div class="n">Error</div><div class="v">--error</div></div><div><div class="chip" style="background:#F8E6E1"></div><div class="n">Error soft</div><div class="v">--error-soft</div></div><div><div class="chip" style="background:#5B7A5B"></div><div class="n">Success</div><div class="v">--success</div></div><div><div class="chip" style="background:#E7EEE7"></div><div class="n">Success soft</div><div class="v">--success-soft</div></div></div></div></body></html>

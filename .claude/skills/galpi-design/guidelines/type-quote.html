<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div class="lbl">--font-quote · --text-quote-lg · 1.6</div><p style="font-family:var(--font-quote);font-size:22px;line-height:1.6;margin:8px 0 0;text-wrap:pretty">새는 알에서 나오려고 투쟁한다. 알은 세계다. 태어나려는 자는 한 세계를 파괴해야 한다.</p><p style="font-family:var(--font-quote);font-size:18px;line-height:1.6;margin:12px 0 0;color:var(--ink-600)">18px — 카드 미리보기용 (2~3줄 말줄임)</p></div></body></html>

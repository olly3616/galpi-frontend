<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="text-align:center"><div style="color:#fff;font-size:15px;font-weight:600;padding:13px 22px;border-radius:var(--radius-control);background:var(--primary)">저장</div><div class="v" style="margin-top:5px">기본</div></div><div style="text-align:center"><div style="color:#fff;font-size:15px;font-weight:600;padding:13px 22px;border-radius:var(--radius-control);background:var(--brown-700)">저장</div><div class="v" style="margin-top:5px">hover</div></div><div style="text-align:center"><div style="color:#fff;font-size:15px;font-weight:600;padding:13px 22px;border-radius:var(--radius-control);background:var(--brown-700);transform:scale(.98)">저장</div><div class="v" style="margin-top:5px">press</div></div><div style="text-align:center"><div style="color:#fff;font-size:15px;font-weight:600;padding:13px 22px;border-radius:var(--radius-control);background:var(--disabled-bg);color:var(--disabled-text)">저장</div><div class="v" style="margin-top:5px">disabled</div></div><div style="text-align:center"><div style="min-width:150px;height:48px;background:var(--surface-card);border:1px solid var(--border-focus);border-radius:var(--radius-control);box-shadow:var(--shadow-focus)"></div><div class="v" style="margin-top:5px">input focus</div></div></div></div></body></html

<!-- @dsCard group="Type" viewport="700x150" name="Pairing rule" subtitle="Serif for 대사 only; every label, button and meta line is sans" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div style="background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-card);padding:14px"><div style="font-size:12px;font-weight:600;color:var(--text-secondary);font-family:var(--font-ui)">등장인물 · sans</div><div style="font-family:var(--font-quote);font-size:19px;line-height:1.6;margin-top:6px">대사 본문 · serif</div><div style="font-size:12px;color:var(--text-secondary);margin-top:10px;font-family:var(--font-ui)">데미안 · 헤르만 헤세 — meta · sans</div></div><div style="font-size:13px;color:var(--text-secondary);line-height:1.6">✔ 대사·빈 화면 안내 문구 → 세리프<br>✔ 타이틀·버튼·라벨·메타 → 산세리프<br>✘ 세리프로 버튼 라벨을 쓰지 않는다<br>✘ 대사를 산세리프로 쓰지 않는다</div></div></div></body></html>

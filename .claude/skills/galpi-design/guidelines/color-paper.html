<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div class="sw"><div><div class="chip" style="background:#FBF9F4"></div><div class="n">Page</div><div class="v">--paper-100</div></div><div><div class="chip" style="background:#FFFFFF"></div><div class="n">Surface</div><div class="v">--paper-50</div></div><div><div class="chip" style="background:#F5F1E8"></div><div class="n">Sunken</div><div class="v">--paper-200</div></div><div><div class="chip" style="background:#EAE4DA"></div><div class="n">Border</div><div class="v">--paper-300</div></div><div><div class="chip" style="background:#D8D0C3"></div><div class="n">Border strong</div><div class="v">--paper-400</div></div></div></div></body></html>

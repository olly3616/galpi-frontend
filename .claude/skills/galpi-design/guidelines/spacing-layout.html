<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="p"><div style="background:var(--bg-page-alt);border-radius:12px;padding:0 20px;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:20px;background:rgba(139,94,60,.10)"></div><div style="position:absolute;right:0;top:0;bottom:0;width:20px;background:rgba(139,94,60,.10)"></div><div style="padding:16px 0;display:flex;flex-direction:column;gap:12px"><div style="background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;font-size:13px;color:var(--text-secondary)">카드 내부 패딩 16 · 요소 간 12</div><div style="background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;font-size:13px;color:var(--text-secondary)">화면 좌우 여백 20 (음영)</div></div></div></div></body></html>

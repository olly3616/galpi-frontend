<!-- @dsCard group="Spacing" viewport="700x140" name="Motion" subtitle="120/200/320ms, custom ease; skeleton shimmer, no bounce" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}.p{padding:18px 20px}.sw{display:flex;gap:10px}.sw>div{flex:1}.chip{height:52px;border-radius:10px;border:1px solid rgba(46,42,38,.08)}.n{font-size:11px;margin-top:6px;color:var(--text-primary);font-weight:600}.v{font-size:10px;color:var(--text-secondary);font-family:ui-monospace,monospace}.lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}@keyframes demo-slide{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}</style></head><body><div class="p"><div style="display:flex;gap:24px;align-items:center"><div><div class="lbl">--duration-base · --ease-standard</div><div style="margin-top:8px;width:180px;height:28px;background:var(--bg-page-alt);border-radius:999px"><div style="width:56px;height:28px;border-radius:999px;background:var(--primary);animation:demo-slide 2.4s var(--ease-standard) infinite"></div></div></div><div style="flex:1"><div class="lbl">skeleton shimmer 1.4s</div><div style="margin-top:8px;display:flex;flex-direction:column;gap:6px"><div style="height:14px;border-radius:8px;background:var(--surface-skeleton);animation:galpi-shimmer 1.4s ease-in-out infinite"></div><div style="height:14px;width:70%;border-radius:8px;background:var(--surface-skeleton);animation:galpi-shimmer 1.4s ease-in-out .2s infinite"></div></div></div></div></div></body></html>
